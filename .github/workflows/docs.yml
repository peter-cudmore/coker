name: Build and deploy docs

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/check-docs.yml

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
