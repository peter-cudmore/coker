name: Run Python tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out in every job
        required: true
        type: string
      release-documentation:
        description: Prepare release HTML and the wheel plus sdist for publication
        default: false
        type: boolean
    outputs:
      distribution-artifact-id:
        description: Immutable artifact containing the tested wheel and sdist
        value: ${{ jobs.wheel.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --frozen --group ci --extra casadi --extra jax --extra pytorch
      - name: Run default test suite
        run: uv run pytest -m "not perf"

  wheel:
    name: Build installed-smoke artifact
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
      - name: Build the distribution once
        run: uv build ${{ inputs.release-documentation && '--sdist --wheel' || '--wheel' }}
      - name: Validate release artifact identities
        if: inputs.release-documentation
        run: |
          uv run --no-project python - <<'PY'
          from pathlib import Path
          import tomllib
          from scripts.verify_release_artifacts import validate_artifacts

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          validate_artifacts(Path("dist"), project["project"]["version"])
          PY
      - uses: actions/upload-artifact@v4
        id: distributions
        with:
          name: ${{ inputs.release-documentation && 'python-package-distributions' || 'installed-smoke-wheel' }}
          path: dist/
          if-no-files-found: error

  installed-smoke:
    name: Installed ${{ matrix.profile }} / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        profile: [base]
        include:
          - {os: ubuntu-latest, python: "3.11", profile: casadi}
          - {os: ubuntu-latest, python: "3.13", profile: casadi}
          - {os: ubuntu-latest, python: "3.11", profile: jax}
          - {os: ubuntu-latest, python: "3.13", profile: jax}
          - {os: ubuntu-latest, python: "3.11", profile: pytorch}
          - {os: ubuntu-latest, python: "3.13", profile: pytorch}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.wheel.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install only the selected extra and exercise the wheel
        shell: python
        env:
          PROFILE: ${{ matrix.profile }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          environment = Path(os.environ["RUNNER_TEMP"]) / "installed-smoke"
          subprocess.run(
              ["uv", "--no-config", "venv", "--python",
               os.environ["PYTHON_VERSION"], str(environment)],
              check=True,
          )
          python = environment / (
              "Scripts/python.exe" if os.name == "nt" else "bin/python"
          )
          wheel, = (root / "dist").glob("*.whl")
          profile = os.environ["PROFILE"]
          requirement = str(wheel)
          if profile != "base":
              requirement += f"[{profile}]"
          install = [
              "uv", "--no-config", "pip", "install",
              "--python", str(python), requirement,
          ]
          if profile == "pytorch":
              install += ["--torch-backend", "cpu"]
          subprocess.run(install, check=True)
          subprocess.run(
              [str(python), "-I",
               str(root / "scripts" / "smoke_installation.py"), profile],
              cwd=os.environ["RUNNER_TEMP"],
              check=True,
          )

  docs:
    name: Test documentation examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --frozen --group ci --group docs --extra casadi --extra jax --extra pytorch
      - name: Run documentation examples
        run: uv run sphinx-build -b doctest docs/ docs/_build/doctest -W --keep-going
      - name: Build documentation
        run: uv run sphinx-build docs/ docs/_build/html -W --keep-going
      - name: Record release documentation provenance
        if: inputs.release-documentation
        run: >-
          uv run python scripts/release_docs.py prepare
          --html docs/_build/html --project pyproject.toml --readme README.md
          --commit "${{ inputs.ref }}"
      - name: Store tested release documentation
        if: inputs.release-documentation
        uses: actions/upload-artifact@v4
        with:
          name: release-documentation
          path: docs/_build/html/
          if-no-files-found: error

  perf:
    name: Run perf tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --frozen --group ci --extra casadi --extra jax --extra pytorch
      - name: Run perf suite
        run: uv run pytest -m perf


  linter-name:
    name: runner / black and flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install package
        run: uv sync --frozen --group ci --extra casadi --extra jax --extra pytorch
      - name: Run black
        run: uv run black --check --diff src
      - name: Run flake8
        run: uv run flake8 src tests docs examples scripts

