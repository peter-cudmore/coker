name: Publish Coker

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  runtime-checks:
    uses: ./.github/workflows/test-and-lint.yml

  documentation-checks:
    uses: ./.github/workflows/check-docs.yml

  verify:
    name: Verify release distributions
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build distribution packages once
        run: uv build
      - name: Check distribution versions and release identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            uv run --no-project scripts/check_release.py --tag "$RELEASE_TAG"
          else
            uv run --no-project scripts/check_release.py
          fi
      - name: Exercise installed wheel outside the checkout
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          uv venv "$smoke_dir/venv"
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          uv pip install --python "$smoke_dir/venv/bin/python" "${wheel[0]}[casadi]"
          cp scripts/smoke_release.py "$smoke_dir/smoke_release.py"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I smoke_release.py
      - name: Store only verified distribution packages
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: verified-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-to-test-pypi:
    name: Publish verified artifacts to TestPyPI
    needs: [runtime-checks, documentation-checks, verify]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/coker
    permissions:
      id-token: write
    steps:
      - name: Download verified distribution packages
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - name: Publish verified packages to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-to-pypi:
    name: Publish verified artifacts to PyPI
    needs: [runtime-checks, documentation-checks, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coker
    permissions:
      id-token: write
    steps:
      - name: Download verified distribution packages
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - name: Publish verified packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
