name: Publish Coker

on:
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  # Hold the production lock through live docs verification and package publication.
  group: ${{ github.event_name == 'push' && 'coker-production-release' || format('coker-release-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  detect-version-bump:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version_bumped: ${{ steps.compare.outputs.version_bumped }}
      head_version: ${{ steps.compare.outputs.head_version }}
      base_version: ${{ steps.compare.outputs.base_version }}
      release-sha: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.sha ||
              github.sha
            }}
      - name: Fetch exact base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$BASE_SHA"
      - name: Compare package versions
        id: compare
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          def parse_simple_version(version: str):
              version_parts = version.split(".")
              if all(part.isdigit() for part in version_parts):
                  return tuple(int(part) for part in version_parts)
              return None

          def version_is_bumped(head_version: str, base_version: str):
              head_simple_version = parse_simple_version(head_version)
              base_simple_version = parse_simple_version(base_version)

              if head_simple_version is not None and base_simple_version is not None:
                  return head_simple_version > base_simple_version
              return head_version != base_version

          event_name = os.environ["EVENT_NAME"]
          head_pyproject = Path("pyproject.toml").read_bytes()
          head_version = tomllib.loads(head_pyproject.decode())["project"]["version"]

          if event_name == "pull_request":
              base_sha = os.environ["BASE_SHA"]
              base_pyproject = subprocess.check_output(
                  ["git", "show", f"{base_sha}:pyproject.toml"]
              )
              base_version = tomllib.loads(base_pyproject.decode())["project"]["version"]
              version_bumped = version_is_bumped(head_version, base_version)
          elif event_name == "push":
              before_sha = os.environ["BEFORE_SHA"]
              if before_sha and before_sha != "0000000000000000000000000000000000000000":
                  base_pyproject = subprocess.check_output(
                      ["git", "show", f"{before_sha}:pyproject.toml"]
                  )
                  base_version = tomllib.loads(base_pyproject.decode())["project"]["version"]
                  version_bumped = version_is_bumped(head_version, base_version)
              else:
                  base_version = ""
                  version_bumped = False
          else:
              raise RuntimeError(f"Unsupported event: {event_name}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output_file:
              output_file.write(f"head_version={head_version}\n")
              output_file.write(f"base_version={base_version}\n")
              output_file.write(
                  f"version_bumped={'true' if version_bumped else 'false'}\n"
              )

  prepare-release:
    name: Validate prepared release
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.version_bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.detect-version-bump.outputs.release-sha }}
      - name: Validate prepared release notes
        shell: python
        env:
          HEAD_VERSION: ${{ needs.detect-version-bump.outputs.head_version }}
        run: |
          import datetime
          import os
          import re
          from pathlib import Path

          version = os.environ["HEAD_VERSION"]
          if not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z.+-]*", version):
              raise RuntimeError("Package version must be safe for a release-notes filename")
          notes_path = Path("release-notes") / f"{version}.md"
          notes = notes_path.read_bytes()
          changelog = Path("CHANGELOG.md").read_bytes()
          headings = list(re.finditer(rb"^## ([^\r\n]+)\r?$", changelog, re.MULTILINE))
          version_prefix = f"{version} - ".encode()
          matching = [
              index for index, heading in enumerate(headings)
              if heading.group(1).startswith(version_prefix)
          ]
          if len(matching) != 1:
              raise RuntimeError(f"Expected exactly one CHANGELOG.md section for {version}")
          index = matching[0]
          heading = headings[index]
          date_text = heading.group(1)[len(version_prefix):].decode("ascii")
          if datetime.date.fromisoformat(date_text).isoformat() != date_text:
              raise RuntimeError("Release date must use YYYY-MM-DD")
          end = headings[index + 1].start() if index + 1 < len(headings) else len(changelog)
          section = changelog[heading.start():end]
          if notes != section:
              raise RuntimeError(f"{notes_path} must exactly match its CHANGELOG.md section")
      - name: Reject conflicting existing release tags before publication
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_VERSION: ${{ needs.detect-version-bump.outputs.head_version }}
          RELEASE_SHA: ${{ needs.detect-version-bump.outputs.release-sha }}
        run: |
          import json
          import os
          import subprocess

          tag = f"v{os.environ['HEAD_VERSION']}"
          remote_tag = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/commits/refs/tags/{tag}"],
              capture_output=True, text=True, encoding="utf-8",
          )
          if remote_tag.returncode == 0:
              tag_sha = json.loads(remote_tag.stdout)["sha"]
              if tag_sha != os.environ["RELEASE_SHA"]:
                  raise RuntimeError(
                      f"Existing tag {tag} resolves to {tag_sha}, not the release commit; refusing publication"
                  )
          elif "HTTP 404" not in remote_tag.stderr:
              raise RuntimeError(remote_tag.stderr)

  release-checks:
    name: Check exact release source and documentation
    needs: [detect-version-bump, prepare-release]
    uses: ./.github/workflows/test-and-lint.yml
    with:
      ref: ${{ needs.detect-version-bump.outputs.release-sha }}
      release-documentation: true

  deploy-release-docs:
    name: Deploy and verify the exact release documentation
    needs: [detect-version-bump, release-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.detect-version-bump.outputs.release-sha }}

  publish-to-test-pypi:
    name: Publish to TestPyPI
    needs: release-checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/coker
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-checks.outputs.distribution-artifact-id }}
          merge-multiple: true
          path: dist/
      - name: Publish distribution packages to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [release-checks, deploy-release-docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coker
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-checks.outputs.distribution-artifact-id }}
          merge-multiple: true
          path: dist/
      - name: Publish distribution packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    name: Publish GitHub Release
    needs: [detect-version-bump, publish-to-pypi]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.detect-version-bump.outputs.release-sha }}
      - name: Publish prepared release notes
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_VERSION: ${{ needs.detect-version-bump.outputs.head_version }}
          RELEASE_SHA: ${{ needs.detect-version-bump.outputs.release-sha }}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          version = os.environ["HEAD_VERSION"]
          tag = f"v{version}"
          notes_path = Path("release-notes") / f"{version}.md"
          notes = notes_path.read_text(encoding="utf-8")
          release_sha = subprocess.run(
              ["git", "rev-parse", f"{os.environ['RELEASE_SHA']}^{{commit}}"],
              check=True, capture_output=True, text=True, encoding="utf-8",
          ).stdout.strip()
          remote_tag = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/commits/refs/tags/{tag}"],
              capture_output=True, text=True, encoding="utf-8",
          )
          if remote_tag.returncode == 0:
              tag_sha = json.loads(remote_tag.stdout)["sha"]
              if tag_sha != release_sha:
                  raise RuntimeError(
                      f"Existing tag {tag} resolves to {tag_sha}, not {release_sha}; refusing to overwrite"
                  )
          elif "HTTP 404" in remote_tag.stderr:
              tag_sha = None
          else:
              raise RuntimeError(remote_tag.stderr)
          existing = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/releases/tags/{tag}"],
              capture_output=True, text=True, encoding="utf-8",
          )
          if existing.returncode == 0:
              release = json.loads(existing.stdout)
              if tag_sha is None:
                  raise RuntimeError(f"Existing release {tag} has no matching remote tag")
              if release["draft"]:
                  raise RuntimeError(f"Existing release {tag} is a draft; refusing to report it as published")
              if release["body"] != notes:
                  raise RuntimeError(f"Existing release {tag} has different notes; refusing to overwrite")
              print(f"Release {tag} already exists with the prepared notes")
          elif "HTTP 404" in existing.stderr:
              subprocess.run(
                  [
                      "gh", "release", "create", tag,
                      "--target", os.environ["RELEASE_SHA"],
                      "--title", version,
                      "--notes-file", str(notes_path),
                  ],
                  check=True,
              )
          else:
              raise RuntimeError(existing.stderr)
